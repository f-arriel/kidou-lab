name: deploy-server
run-name: Deploy to university server

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test whether the server is reachable
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          echo "--- DNS lookup ---"
          getent hosts "$SFTP_HOST" || echo "!! hostname did not resolve"
          echo "--- port 22 ---"
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/$SFTP_HOST/22" 2>/dev/null; then
            echo "OK: port 22 is open"
          else
            echo "!! port 22 unreachable - firewall, wrong host, or non-standard port"
          fi

      - name: Install Ruby packages
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Set root URL
        run: |
          printf "\n\nurl: https://www.nsc.nagoya-cu.ac.jp" >> _config.yaml

      - name: Build site for the university server
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --baseurl "/~kidou"

      - name: Upload over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SSHPASS: ${{ secrets.SFTP_PASS }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp sshpass
          lftp -c "
            set sftp:auto-confirm yes;
            set sftp:connect-program \"sshpass -e ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null\";
            set net:max-retries 1;
            set net:timeout 30;
            open -u \"$SFTP_USER\",ignored sftp://$SFTP_HOST;
            mirror -R --verbose _site/ \"$SFTP_PATH\"
          "
