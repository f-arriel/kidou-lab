# map general type to default/fallback icon, text, etc.

# team member roles
principal-investigator:
  icon: "fa-solid fa-microscope"
  description: "教授 / Principal Investigator"

postdoc:
  icon: "fa-solid fa-glasses"
  description: "研究員 / Postdoctoral Researcher"

research-staff:
  icon: "fa-solid fa-flask"
  description: "研究員 / Research Staff"

phd:
  icon: "fa-solid fa-graduation-cap"
  description: "博士後期課程 / PhD Student"

master:
  icon: "fa-solid fa-user-graduate"
  description: "博士前期課程 / Master Student"

undergrad:
  icon: "fa-solid fa-book-open"
  description: "学部生 / Undergraduate Student"

# general
link:
  icon: "fa-solid fa-globe"
  text: "リンク / Link"
  tooltip: "リンク / Link"

website:
  icon: "fa-solid fa-globe"
  text: "ウェブサイト / Website"
  tooltip: "ウェブサイト / Website"
  link: "$VALUE"

external:
  icon: "fa-solid fa-up-right-from-square"
  text: "外部リンク / External Link"
  tooltip: "外部リンク / External link"

home-page:
  icon: "fa-solid fa-house-user"
  text: "ホーム / Home Page"
  tooltip: "ホーム / Home page"

email:
  icon: "fa-solid fa-envelope"
  text: "メール / Email"
  tooltip: "メール / Email"
  link: "mailto:$VALUE"

phone:
  icon: "fa-solid fa-phone"
  text: "電話 / Phone Number"
  tooltip: "電話 / Phone number"
  link: "tel:$VALUE"

address:
  icon: "fa-solid fa-map-location-dot"
  text: "住所 / Address"
  tooltip: "住所 / Address"

search:
  icon: "fa-solid fa-magnifying-glass"
  text: "検索 / Search"
  tooltip: "検索 / Search"

# social media & academic profiles
orcid:
  icon: "fa-brands fa-orcid"
  text: "ORCID"
  tooltip: "ORCID"
  link: "https://orcid.org/$VALUE"

google-scholar:
  icon: "fa-brands fa-google"
  text: "Google Scholar"
  tooltip: "Google Scholar"
  link: "https://scholar.google.com/citations?user=$VALUE"

researchgate:
  icon: "fa-brands fa-researchgate"
  text: "ResearchGate"
  tooltip: "ResearchGate"
  link: "https://www.researchgate.net/profile/$VALUE"

researchmap:
  icon: "fa-solid fa-map-location-dot"
  text: "Researchmap"
  tooltip: "Researchmap"
  link: "https://researchmap.jp/$VALUE"

github:
  icon: "fa-brands fa-github"
  text: "GitHub"
  tooltip: "GitHub"
  link: "https://github.com/$VALUE"

twitter:
  icon: "fa-brands fa-twitter"
  text: "Twitter"
  tooltip: "Twitter"
  link: "https://twitter.com/$VALUE"

youtube:
  icon: "fa-brands fa-youtube"
  text: "YouTube"
  tooltip: "YouTube"
  link: "https://youtube.com/$VALUE"

# alerts
tip:
  icon: "fa-solid fa-lightbulb"
  color: "#d946ef"

help:
  icon: "fa-solid fa-circle-question"
  color: "#6366f1"

