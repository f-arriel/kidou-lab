backend:
  name: git-gateway
  branch: main

media_folder: "images/news"
public_folder: "/images/news"

collections:
  - name: "news"
    label: "Lab News"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "members"
    label: "Lab Members"
    folder: "_members"
    create: true
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Role", name: "role", widget: "select", options: ["principal-investigator", "postdoc", "phd", "master", "undergrad"]}
      - {label: "Portrait Image", name: "image", widget: "image", required: false}
      - {label: "Biography", name: "body", widget: "markdown"}

  - name: "publications"
    label: "Publications & DOIs"
    files:
      - label: "DOI List"
        name: "sources"
        file: "_data/sources.yaml"
        fields:
          - label: "Citations"
            name: "citations"
            widget: "list"
            fields:
              - {label: "DOI (must start with doi:)", name: "id", widget: "string"}
              - {label: "Representative Figure", name: "image", widget: "image", required: false}
