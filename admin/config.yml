# =============================================================
#  Kidou Lab — Sveltia CMS configuration
#  Tailored to the greenelab/lab-website-template structure
# =============================================================

backend:
  name: github
  repo: f-arriel/kidou-lab
  branch: main
  base_url: https://https://sveltia-cms-auth.fadhilah-arriel.workers.dev/

# Default upload location (overridden per collection below)
media_folder: "images"
public_folder: "images"

collections:
  # -----------------------------------------------------------
  # 1. NEWS POSTS  ->  _posts/*.md
  # -----------------------------------------------------------
  - name: "news"
    label: "お知らせ / Lab News"
    label_singular: "お知らせ / News post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    media_folder: "/images/news"
    public_folder: "images/news"
    fields:
      - label: "タイトル / Title"
        name: "title"
        widget: "string"

      - label: "日付 / Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        picker_utc: false

      - label: "投稿者 / Author"
        name: "author"
        widget: "relation"
        collection: "members"
        value_field: "{{slug}}"
        search_fields: ["name"]
        display_fields: ["name"]
        required: false
        hint: "メンバー一覧から選ぶと顔写真付きで表示されます。"

      - label: "タグ / Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "例: Conference, CISP, P23k"

      - label: "見出し画像 / Banner image"
        name: "image"
        widget: "image"
        required: false
        hint: "任意。記事一覧のサムネイルと記事上部の背景になります。"

      - label: "本文 / Body"
        name: "body"
        widget: "markdown"

  # -----------------------------------------------------------
  # 2. LAB MEMBERS  ->  _members/*.md
  # -----------------------------------------------------------
  - name: "members"
    label: "メンバー / Lab Members"
    label_singular: "メンバー / Member"
    folder: "_members"
    create: true
    slug: "{{fields.username}}"
    extension: "md"
    format: "yaml-frontmatter"
    identifier_field: "name"
    media_folder: "/images"
    public_folder: "images"
    view_groups:
      - label: "区分 / Role"
        field: "role"
    fields:
      - label: "氏名 / Name"
        name: "name"
        widget: "string"
        hint: "例: 木藤 新一郎 / Shin-ichiro Kidou"

      - label: "ファイル名 / Username"
        name: "username"
        widget: "string"
        hint: "半角小文字・スペースなし（例: kidou）。ページURLと、記事の投稿者欄で使われます。"

      - label: "区分 / Role"
        name: "role"
        widget: "select"
        options:
          - { label: "教授 / Principal Investigator", value: "principal-investigator" }
          - { label: "研究員 / Postdoctoral Researcher", value: "postdoc" }
          - { label: "研究員 / Research Staff", value: "research-staff" }
          - { label: "博士後期課程 / PhD Student", value: "phd" }
          - { label: "博士前期課程 / Master Student", value: "master" }
          - { label: "学部生 / Undergraduate Student", value: "undergrad" }
          - { label: "卒業生 / Alumni", value: "alumni" }

      - label: "卒業年 / Year left"
        name: "graduation_year"
        widget: "number"
        value_type: "int"
        required: false
        hint: "卒業生のみ。新しい順に並びます。"

      - label: "顔写真 / Portrait"
        name: "image"
        widget: "image"
        required: false

      - label: "肩書き（任意）/ Custom description"
        name: "description"
        widget: "string"
        required: false
        hint: "空欄なら区分から自動で入ります。"

      - label: "所属（任意）/ Affiliation"
        name: "affiliation"
        widget: "string"
        required: false

      - label: "リンク / Links"
        name: "links"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "ORCID iD", name: "orcid", widget: "string", required: false, hint: "0000-0001-8829-7950 の形式" }
          - { label: "Google Scholar ID", name: "google-scholar", widget: "string", required: false }
          - { label: "ResearchGate", name: "researchgate", widget: "string", required: false }
          - { label: "researchmap", name: "researchmap", widget: "string", required: false }
          - { label: "Website URL", name: "website", widget: "string", required: false }
          - { label: "GitHub", name: "github", widget: "string", required: false }

      - label: "紹介文 / Biography"
        name: "body"
        widget: "markdown"
        required: false

  # -----------------------------------------------------------
  # 3. RESEARCH THEMES  ->  _themes/*.md
  # -----------------------------------------------------------
  - name: "themes"
    label: "研究テーマ / Research Themes"
    label_singular: "テーマ / Theme"
    folder: "_themes"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    media_folder: "/images"
    public_folder: "images"
    identifier_field: "title"
    view_groups:
      - label: "状態 / Status"
        field: "status"
    fields:
      - label: "テーマ名 / Title"
        name: "title"
        widget: "string"
        hint: "例: 天然変性タンパク質と低温ストレス / Disordered Proteins to Survive Cold"
      - label: "状態 / Status"
        name: "status"
        widget: "select"
        options:
          - { label: "現在のテーマ / Current", value: "current" }
          - { label: "過去のテーマ / Past", value: "past" }
      - label: "表示順 / Order"
        name: "order"
        widget: "number"
        value_type: "int"
        required: false
        hint: "小さい数字が上に表示されます。"
      - label: "画像 / Image"
        name: "image"
        widget: "image"
        required: false
      - label: "説明 / Description"
        name: "body"
        widget: "markdown"

  # -----------------------------------------------------------
  # 4. EMPLOYMENT  ->  _employment/*.md
  # -----------------------------------------------------------
  - name: "employment"
    label: "就職先 / Employment"
    label_singular: "就職先 / Employer"
    folder: "_employment"
    create: true
    slug: "{{year}}-{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    identifier_field: "organization"
    fields:
      - label: "就職先 / Organization"
        name: "organization"
        widget: "string"
        hint: "組織名のみを記載してください（個人名は不要）。"
      - label: "年 / Year"
        name: "year"
        widget: "number"
        value_type: "int"
      - label: "課程 / Degree"
        name: "degree"
        widget: "select"
        required: false
        options:
          - { label: "博士後期課程 / PhD", value: "博士後期課程" }
          - { label: "博士前期課程 / Master", value: "博士前期課程" }
          - { label: "学部 / Undergraduate", value: "学部" }
      - label: "業種 / Sector"
        name: "sector"
        widget: "string"
        required: false
        hint: "任意。例: 食品、製薬、教育、公務員"

  # -----------------------------------------------------------
  # 5. SOCIAL CONTRIBUTION  ->  _outreach/*.md
  # -----------------------------------------------------------
  - name: "outreach"
    label: "社会貢献 / Social Contribution"
    label_singular: "活動 / Activity"
    folder: "_outreach"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    media_folder: "/images/outreach"
    public_folder: "images/outreach"
    identifier_field: "title"
    view_groups:
      - label: "種別 / Category"
        field: "category"
    fields:
      - label: "活動名 / Title"
        name: "title"
        widget: "string"
      - label: "日付 / Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "種別 / Category"
        name: "category"
        widget: "select"
        options:
          - { label: "公開講座 / Public lecture", value: "公開講座" }
          - { label: "出前授業 / School outreach", value: "出前授業" }
          - { label: "オープンキャンパス / Open campus", value: "オープンキャンパス" }
          - { label: "取材・報道 / Media", value: "取材・報道" }
          - { label: "学会運営 / Academic service", value: "学会運営" }
          - { label: "地域連携 / Community", value: "地域連携" }
          - { label: "その他 / Other", value: "その他" }
      - label: "主催・場所 / Host or venue"
        name: "venue"
        widget: "string"
        required: false
      - label: "担当者 / Participants"
        name: "participants"
        widget: "string"
        required: false
        hint: "任意。例: 木藤、加藤"
      - label: "関連リンク / Link"
        name: "link"
        widget: "string"
        required: false
        hint: "任意。報道記事や告知ページのURL"
      - label: "写真 / Photo"
        name: "image"
        widget: "image"
        required: false
      - label: "内容 / Description"
        name: "body"
        widget: "markdown"
        required: false

  # -----------------------------------------------------------
  # 6. PHOTO GALLERY  ->  _gallery/*.md
  # -----------------------------------------------------------
  - name: "gallery"
    label: "活動写真 / Photo Gallery"
    label_singular: "写真 / Photo"
    folder: "_gallery"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    media_folder: "/images/people"
    public_folder: "images/people"
    identifier_field: "title"
    fields:
      - label: "見出し / Title"
        name: "title"
        widget: "string"
        hint: "管理用の名前です。サイトには表示されません。"
      - label: "日付 / Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "新しい写真が上に表示されます。"
      - label: "写真 / Photo"
        name: "image"
        widget: "image"
      - label: "説明 / Caption"
        name: "caption"
        widget: "string"
        required: false

  # -----------------------------------------------------------
  # 7. PUBLICATIONS  ->  _data/sources-cms.yaml
  #    Requires the small _cite/util.py patch (see notes).
  # -----------------------------------------------------------
  - name: "publications"
    label: "業績 / Publications"
    editor:
      preview: false
    files:
      - label: "DOI リスト / DOI list"
        name: "sources"
        file: "_data/sources-cms.yaml"
        fields:
          - label: "論文 / Papers"
            name: "sources"
            widget: "list"
            summary: "{{fields.id}}"
            fields:
              - label: "DOI"
                name: "id"
                widget: "string"
                hint: "10. で始まる番号のみ（例: 10.1002/pld3.70179）"
              - label: "種別 / Type"
                name: "type"
                widget: "select"
                required: false
                options: ["paper", "preprint", "book", "article", "journal"]
              - label: "図 / Representative figure"
                name: "image"
                widget: "image"
                required: false

  # -----------------------------------------------------------
  # 8. SITE PAGES  ->  index.md, research/, team/, contact/, ...
  #    Body is a plain textarea on purpose: these pages contain
  #    raw HTML and Liquid tags that a rich-text editor would break.
  # -----------------------------------------------------------
  - name: "pages"
    label: "固定ページ / Site Pages"
    editor:
      preview: false
    files:
      - label: "ホーム / Home"
        name: "home"
        file: "index.md"
        fields:
          - label: "本文 / Body (HTML + Markdown)"
            name: "body"
            widget: "text"

      - label: "研究内容 / Research"
        name: "research"
        file: "research/index.md"
        fields:
          - { label: "ページ名 / Page title", name: "title", widget: "string" }
          - label: "ナビ設定 / Navigation"
            name: "nav"
            widget: "object"
            fields:
              - { label: "並び順 / Order", name: "order", widget: "number", value_type: "int" }
              - { label: "説明 / Tooltip", name: "tooltip", widget: "string", required: false }
          - { label: "本文 / Body (HTML + Markdown)", name: "body", widget: "text" }

      - label: "メンバー紹介ページ / Team page"
        name: "team"
        file: "team/index.md"
        fields:
          - { label: "ページ名 / Page title", name: "title", widget: "string" }
          - label: "ナビ設定 / Navigation"
            name: "nav"
            widget: "object"
            fields:
              - { label: "並び順 / Order", name: "order", widget: "number", value_type: "int" }
              - { label: "説明 / Tooltip", name: "tooltip", widget: "string", required: false }
          - { label: "本文 / Body (HTML + Markdown)", name: "body", widget: "text" }

      - label: "業績・社会貢献ページ / Publications page"
        name: "projects"
        file: "projects/index.md"
        fields:
          - { label: "ページ名 / Page title", name: "title", widget: "string" }
          - label: "ナビ設定 / Navigation"
            name: "nav"
            widget: "object"
            fields:
              - { label: "並び順 / Order", name: "order", widget: "number", value_type: "int" }
              - { label: "説明 / Tooltip", name: "tooltip", widget: "string", required: false }
          - { label: "本文 / Body (HTML + Markdown)", name: "body", widget: "text" }

      - label: "お知らせ一覧ページ / News page"
        name: "blog"
        file: "blog/index.md"
        fields:
          - { label: "ページ名 / Page title", name: "title", widget: "string" }
          - label: "ナビ設定 / Navigation"
            name: "nav"
            widget: "object"
            fields:
              - { label: "並び順 / Order", name: "order", widget: "number", value_type: "int" }
              - { label: "説明 / Tooltip", name: "tooltip", widget: "string", required: false }
          - { label: "本文 / Body (HTML + Markdown)", name: "body", widget: "text" }

      - label: "アクセス / Contact"
        name: "contact"
        file: "contact/index.md"
        fields:
          - { label: "ページ名 / Page title", name: "title", widget: "string" }
          - label: "ナビ設定 / Navigation"
            name: "nav"
            widget: "object"
            fields:
              - { label: "並び順 / Order", name: "order", widget: "number", value_type: "int" }
              - { label: "説明 / Tooltip", name: "tooltip", widget: "string", required: false }
          - { label: "本文 / Body (HTML + Markdown)", name: "body", widget: "text" }
